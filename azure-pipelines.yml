
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 9 SDK'
    inputs:
      packageType: 'sdk'
      version: '9.x'

  - task: DotNetCoreCLI@2
    displayName: 'Restore dependencies'
    inputs:
      command: 'restore'
      projects: 'APPR.coreproject.slnx'

  - task: DotNetCoreCLI@2
    displayName: 'Build solution'
    inputs:
      command: 'build'
      projects: 'APPR.coreproject.slnx'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: DotNetCoreCLI@2
    displayName: 'Run unit tests'
    inputs:
      command: 'test'
      projects: 'APPR.coreproject.Tests/APPR.coreproject.Tests.csproj'
      arguments: '--configuration $(buildConfiguration) --no-build --no-restore'
      publishTestResults: true

  - task: DotNetCoreCLI@2
    displayName: 'Publish ASP.NET Core application'
    inputs:
      command: 'publish'
      publishWebProjects: false
      projects: 'APPR.coreproject/APPR.coreproject.csproj'
      arguments: '--configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/publish --no-build --no-restore'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish build artifact'
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)/publish'
      ArtifactName: 'APPR-coreproject'
      publishLocation: 'Container'
