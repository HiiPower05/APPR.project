
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 9 SDK'
    inputs:
      packageType: 'sdk'
      version: '9.x'

  - task: DotNetCoreCLI@2
    displayName: 'Restore dependencies'
    inputs:
      command: 'restore'
      projects: 'APPR.coreproject.slnx'

  - task: DotNetCoreCLI@2
    displayName: 'Build solution'
    inputs:
      command: 'build'
      projects: 'APPR.coreproject.slnx'
      arguments: '--configuration $(buildConfiguration) --no-restore'

  - task: PowerShell@2
    displayName: 'Start ASP.NET Core application'
    inputs:
      targetType: 'inline'
      script: |
        $appPath = "$(Build.SourcesDirectory)\APPR.coreproject\bin\Release\net9.0\APPR.coreproject.dll"

        $process = Start-Process dotnet -ArgumentList "`"$appPath`" --urls http://localhost:7090" -PassThru

        $ready = $false

        for ($i = 0; $i -lt 30; $i++) {
          try {
            Invoke-WebRequest http://localhost:7090 -UseBasicParsing -TimeoutSec 2 | Out-Null
            $ready = $true
            break
          }
          catch {
            Start-Sleep -Seconds 2
          }
        }

        if (-not $ready) {
          throw "ASP.NET Core application did not start."
        }

  - task: DotNetCoreCLI@2
    displayName: 'Run unit tests'
    inputs:
      command: 'test'
      projects: 'APPR.coreproject.Tests/APPR.coreproject.Tests.csproj'
      arguments: '--configuration $(buildConfiguration) --no-build --no-restore'
      publishTestResults: true
